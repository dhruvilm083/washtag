# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: Washtag
options:
  bundleIdPrefix: com.example   # change to your own reverse domain, e.g. com.dhru
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.1.0

configs:
  Debug: debug
  Release: release

targets:
  Washtag:
    type: application
    platform: iOS
    sources: [Washtag]
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WASHTAG_BUNDLE_ID)
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-ObjC"]
    info:
      path: Washtag/Info.plist
      properties:
        CFBundleDisplayName: Washtag
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Washtag uses the camera to photograph care labels and scan barcodes.
        NSPhotoLibraryUsageDescription: Washtag reads a care-label photo you choose from your library.
        NSUserTrackingUsageDescription: This lets ads be more relevant to you. Washtag works the same either way.
        GADApplicationIdentifier: $(GAD_APP_ID)
        WashtagAPIBase: $(WASHTAG_API_BASE)
        WashtagAppToken: $(WASHTAG_APP_TOKEN)
        WashtagAppOpenAdUnit: $(GAD_APP_OPEN_UNIT)
        WashtagPrivacyURL: $(WASHTAG_PRIVACY_URL)
